user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 100M;

    # 공통 인증서 설정
    ssl_certificate     /etc/letsencrypt/live/j14e101.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j14e101.p.ssafy.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ==========================================
    # 🏆 1. 운영(Prod) 환경
    # ==========================================

    # HTTP(80) -> HTTPS(443) 자동 리다이렉트
    server {
        listen 80;
        server_name j14e101.p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    # 실제 HTTPS(443) 운영 서버
    server {
        listen 443 ssl;
        server_name j14e101.p.ssafy.io;

        location / {
            proxy_pass http://prod-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # [Prod] 카카오 로그인 및 OAuth2 엔드포인트
        location /oauth2/authorization/ {
            proxy_pass http://prod-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # [Prod] OAuth2 콜백 엔드포인트
        location /login/ {
            proxy_pass http://prod-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://prod-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui/ {
            proxy_pass http://prod-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /v3/api-docs {
            proxy_pass http://prod-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ai/ {
            proxy_pass http://prod-ai:8000;
            proxy_set_header Host $host;
        }
    }

    # ==========================================
    # 🛠️ 2. 개발(Dev) 환경 - 3000번 포트 (HTTPS)
    # ==========================================
    server {
        listen 3000 ssl; # Nginx 내부에서도 3000번을 직접 듣습니다.
        server_name j14e101.p.ssafy.io;

        location / {
            proxy_pass http://dev-frontend:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # [Dev] 카카오 로그인 및 OAuth2 엔드포인트
        location /oauth2/authorization/ {
            proxy_pass http://dev-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # [Dev] OAuth2 콜백 엔드포인트
        location /login/ {
            proxy_pass http://dev-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://dev-backend:8080;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $host;
        }

        # [Dev] Swagger UI 및 API Docs 경로 연결
        location /swagger-ui/ {
            proxy_pass http://dev-backend:8080;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://dev-backend:8080;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # ==========================================
    # 🛠️ 3. 젠킨스(Jenkins) 관리 환경 - 9090번 포트 (HTTPS)
    # ==========================================
    server {
        listen 9090 ssl;
        server_name j14e101.p.ssafy.io;

        location / {
            # 도커 내부망이므로 'jenkins'라는 컨테이너 이름과 기본 포트 8080으로 찔러줍니다.
            proxy_pass http://jenkins:8080;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}