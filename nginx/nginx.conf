user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================================
    # 🏆 1. 운영(Prod) 환경 - 80번 포트로 들어올 때
    # ==========================================
    server {
        listen 80;
        server_name j14e101.p.ssafy.io;

        # 🌐 프론트엔드 (기본 화면)
        location / {
            proxy_pass http://prod-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # ⚙️ 백엔드 API (주소에 /api가 붙어있으면 백엔드로 보냄)
        location /api/ {
            proxy_pass http://prod-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # 🤖 AI API (주소에 /ai가 붙어있으면 AI 서버로 보냄)
        location /ai/ {
            proxy_pass http://prod-ai:8000;
            proxy_set_header Host $host;
        }
    }

    # ==========================================
    # 🛠️ 2. 개발(Dev) 환경 - 3000번 포트로 들어올 때
    # ==========================================
    server {
        listen 3000;
        server_name j14e101.p.ssafy.io;

        # 🌐 프론트엔드 (Dev)
        location / {
            proxy_pass http://dev-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # ⚙️ 백엔드 API (Dev)
        location /api/ {
            proxy_pass http://dev-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # 🤖 AI API (Dev)
        location /ai/ {
            proxy_pass http://dev-ai:8000;
            proxy_set_header Host $host;
        }
    }
}