user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 공통 인증서 설정 (중복 방지를 위해 위로 뺌)
    ssl_certificate     /etc/letsencrypt/live/j14e101.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j14e101.p.ssafy.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ==========================================
    # 🏆 1. 운영(Prod) 환경
    # ==========================================

    # HTTP(80)로 오면 HTTPS로 보내기
    server {
        listen 80;
        server_name j14e101.p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    # 실제 HTTPS(443) 운영 서버
    server {
        listen 443 ssl;
        server_name j14e101.p.ssafy.io;

        location / {
            proxy_pass http://prod-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://prod-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ai/ {
            proxy_pass http://prod-ai:8000;
            proxy_set_header Host $host;
        }
    }

    # ==========================================
    # 🛠️ 2. 개발(Dev) 환경 - 3000번 포트 (HTTPS)
    # ==========================================
    server {
        listen 443 ssl;
        server_name j14e101.p.ssafy.io;

        location / {
            proxy_pass http://dev-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://dev-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}